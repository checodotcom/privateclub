backend:
  name: github
  repo: checodotcom/privateclub
  branch: main

publish_mode: editorial_workflow

media_folder: "src/img"
public_folder: "/img"

collections:
  - name: "albumes"
    label: "Álbumes"
    label_singular: "Álbum"
    description: "Publicaciones de formato Álbumes."
    folder: "src/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    filter: {field: "formato", value: "albumes"}
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "post.njk"}
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Fecha", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true}
      - {label: "Imagen de portada", name: "image", widget: "image", required: false, media_folder: "/src/img", public_folder: "/img"}
      - {label: "Extracto", name: "excerpt", widget: "text", hint: "Descripción corta que aparece en la lista de posts."}
      - {label: "Formato", name: "formato", widget: "hidden", default: "albumes"}
      - label: "Tags"
        name: "tags"
        widget: "select"
        multiple: true
        default: ["posts"]
        options: ["posts", "ambient", "electronic", "jazz", "noise", "post-punk", "experimental", "world", "downtempo", "trip-hop"]
      - {label: "Cuerpo", name: "body", widget: "markdown"}

  - name: "selecciones"
    label: "Selecciones"
    label_singular: "Selección"
    description: "Publicaciones de formato Selecciones (playlists semanales)."
    folder: "src/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    filter: {field: "formato", value: "selecciones"}
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "post.njk"}
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Fecha", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true}
      - {label: "Imagen de portada", name: "image", widget: "image", required: false, media_folder: "/src/img", public_folder: "/img"}
      - {label: "Extracto", name: "excerpt", widget: "text", hint: "Descripción corta que aparece en la lista de posts."}
      - {label: "Formato", name: "formato", widget: "hidden", default: "selecciones"}
      - label: "Tags"
        name: "tags"
        widget: "select"
        multiple: true
        default: ["posts"]
        options: ["posts", "ambient", "electronic", "jazz", "noise", "post-punk", "experimental", "world", "downtempo", "trip-hop"]
      - label: "La selección"
        name: "seleccionUrl"
        widget: "string"
        required: false
        hint: "Link para compartir de una playlist, álbum o track de Spotify. Se muestra como reproductor en la publicación."
      - {label: "Cuerpo", name: "body", widget: "markdown"}

  - name: "config"
    label: "Configuración"
    files:
      - file: "src/_data/site.json"
        label: "Configuración del sitio"
        name: "site"
        fields:
          - {label: "Ahora suena — Artista", name: "nowPlayingArtist", widget: "string", required: false}
          - {label: "Ahora suena — Álbum / Canción", name: "nowPlayingTrack", widget: "string", required: false}
          - label: "Redes sociales"
            name: "socialLinks"
            widget: "list"
            required: false
            fields:
              - {label: "Nombre", name: "label", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}

  - name: "about"
    label: "Acerca de"
    files:
      - file: "src/_data/about.json"
        label: "Página Acerca de"
        name: "about"
        fields:
          - {label: "Contenido", name: "content", widget: "markdown"}
